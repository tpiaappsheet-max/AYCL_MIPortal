<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI Portal - AYCL Field Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .sidebar-hidden { display: none !important; }
        @media (min-width: 768px) { .sidebar-hidden { display: flex !important; } }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    </style>
</head>

<body class="min-h-screen h-screen flex flex-col antialiased bg-slate-50 overflow-hidden m-0 p-0">

    <script>
        // 🎯 PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbzz97XaDNVrvlAkPE8iySoMSMZmsafTSRmW7tbDlrI9SdfoUk0CRvAFbej1UAhxECI6ww/exec";
        
        const CLIENTS = {
            "AYCL": { name: "Andrew Yule and Company Limited", shortName: "AYCL", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMBVkToRt50US-6-8ZKBQ_ZeaPmA_CfHq9ct_5TSV5SA&s" },
            "NPCC": { name: "National Projects Construction Corporation Limited", shortName: "NPCC", logo: "https://www.uxdt.nic.in/wp-content/uploads/2020/06/NPCC-Preview.png" }
        };

        let currentMiUser = null;
        window.CURRENT_CLIENT = "AYCL"; // Default strictly to AYCL

        // Global Fetch Interceptor to always append client=AYCL
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            let resource = args[0];
            let config = args[1] || {};
            if (typeof resource === 'string' && resource.includes("script.google.com/macros")) {
                if (!config.method || config.method.toUpperCase() === 'GET') {
                    if (resource.includes('?')) {
                        if (!resource.includes('client=')) resource += `&client=${window.CURRENT_CLIENT}`;
                    } else {
                        resource += `?client=${window.CURRENT_CLIENT}`;
                    }
                } else if (config.method && config.method.toUpperCase() === 'POST' && config.body) {
                    try {
                        let bodyObj = JSON.parse(config.body);
                        if (!bodyObj.client) { bodyObj.client = window.CURRENT_CLIENT; config.body = JSON.stringify(bodyObj); }
                    } catch(e) {}
                }
                args[0] = resource;
                args[1] = config;
            }
            return originalFetch(...args);
        };
    </script>

    <div id="mi-app-root" class="w-full h-full flex flex-col overflow-hidden"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cached = localStorage.getItem("mi_aycl_inspector_cache");
            if (cached) {
                try {
                    currentMiUser = JSON.parse(cached);
                    if (currentMiUser.client && currentMiUser.client.toUpperCase() !== "AYCL") {
                        inspectorLogout();
                        return;
                    }
                    window.CURRENT_CLIENT = "AYCL";
                    mountInspectorShell();
                } catch (e) { inspectorLogout(); }
            } else { renderInspectorLogin(); }
        });

        function renderInspectorLogin() {
            const root = document.getElementById("mi-app-root");
            root.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-900 h-full w-full">
                    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 border border-slate-800">
                        <div class="text-center mb-6">
                            <div class="inline-flex p-3 bg-slate-50 rounded-2xl mb-3 shadow-inner border border-slate-100">
                                <img src="${CLIENTS['AYCL'].logo}" alt="Logo" class="w-12 h-12 object-contain">
                            </div>
                            <h2 class="text-base font-black text-slate-900 tracking-tight">Inspector Field Portal</h2>
                            <p class="text-[11px] text-slate-500 mt-1 uppercase font-bold tracking-wider">AYCL Operations Workspace</p>
                        </div>
                        <form onsubmit="handleInspectorLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Username</label>
                                <input type="text" id="insp-user" required class="w-full px-4 py-3 border border-slate-300 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter username">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Password</label>
                                <input type="password" id="insp-pass" required class="w-full px-4 py-3 border border-slate-300 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                            </div>
                            <button type="submit" id="login-submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase tracking-wider rounded-xl shadow-md transition cursor-pointer flex items-center justify-center gap-2">
                                <span>Inspector Login</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        async function handleInspectorLogin(e) {
            e.preventDefault();
            const u = document.getElementById("insp-user").value.trim();
            const p = document.getElementById("insp-pass").value.trim();

            const btn = document.getElementById("login-submit-btn");
            const originalBtnHtml = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Authenticating...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                const res = await originalFetch(`${API_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
                const data = await res.json();

                if (data.status && data.role === 'inspector') {
                    const assignedClient = (data.client || 'AYCL').toUpperCase();

                    // 🎯 RESTRICTION: Only allow AYCL inspectors
                    if (assignedClient !== 'AYCL') {
                        alert("Access Denied: You are not authorized to log in through this portal.");
                        btn.innerHTML = originalBtnHtml;
                        btn.disabled = false;
                        lucide.createIcons();
                        return;
                    }

                    currentMiUser = { username: u, name: data.name, role: 'inspector', client: 'AYCL', inspectorId: data.inspectorId };
                    window.CURRENT_CLIENT = "AYCL";
                    localStorage.setItem("mi_aycl_inspector_cache", JSON.stringify(currentMiUser));
                    mountInspectorShell();
                } else {
                    alert("Invalid inspector credentials.");
                    btn.innerHTML = originalBtnHtml;
                    btn.disabled = false;
                    lucide.createIcons();
                }
            } catch (err) { 
                alert("Login failed due to network connection."); 
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function inspectorLogout() {
            currentMiUser = null;
            localStorage.removeItem("mi_aycl_inspector_cache");
            renderInspectorLogin();
        }

        function mountInspectorShell() {
            const root = document.getElementById("mi-app-root");
            const clientObj = CLIENTS["AYCL"];

            root.innerHTML = `
                <div class="flex w-full h-screen overflow-hidden relative">
                    <aside id="inspector-sidebar" class="sidebar-hidden md:flex absolute md:relative w-64 h-full bg-slate-900 text-white flex-col justify-between border-r border-slate-800 z-50 shadow-2xl">
                        <div class="flex-1 overflow-y-auto custom-scrollbar pb-4">
                            <div class="p-4 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <img src="${clientObj.logo}" alt="Logo" class="w-8 h-8 object-contain bg-white rounded-lg p-0.5">
                                    <span class="font-black text-[12px] tracking-tight uppercase text-slate-200">${clientObj.shortName} Workspace</span>
                                </div>
                                <button onclick="toggleSidebar()" class="md:hidden text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <nav class="mt-3 pr-3 space-y-1">
                                <button onclick="loadInspectorModule('inspectorDashboard', this)" id="nav-inspectorDashboard" class="insp-nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-400 hover:bg-slate-800 hover:text-white transition rounded-r-lg text-left">
                                    <i data-lucide="briefcase" class="w-4 h-4 text-emerald-400"></i> My Inspections
                                </button>
                                <button onclick="loadInspectorModule('changeCredential', this)" id="nav-changeCredential" class="insp-nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-400 hover:bg-slate-800 hover:text-white transition rounded-r-lg text-left">
                                    <i data-lucide="shield-check" class="w-4 h-4 text-blue-400"></i> Account Settings
                                </button>
                            </nav>
                        </div>
                        <div class="p-4 bg-slate-950 border-t border-slate-800">
                            <div class="text-[10px] text-slate-400 mb-2 truncate">Inspector: <strong class="text-emerald-400">${currentMiUser.name}</strong></div>
                            <button onclick="inspectorLogout()" class="w-full py-2.5 rounded-xl text-xs font-black text-white bg-rose-600 hover:bg-rose-700 transition flex items-center justify-center gap-2">
                                <i data-lucide="power" class="w-4 h-4"></i> Logout
                            </button>
                        </div>
                    </aside>
                    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative">
                        <div class="bg-white border-b border-slate-200 flex items-center justify-between px-4 py-3 md:hidden">
                            <button onclick="toggleSidebar()" class="text-slate-800"><i data-lucide="menu" class="w-6 h-6"></i></button>
                            <span class="font-black text-xs uppercase text-slate-800">${clientObj.shortName} Inspector</span>
                        </div>
                        <main id="inspector-viewport" class="flex-1 p-3 sm:p-6 overflow-y-auto custom-scrollbar bg-slate-50"></main>
                    </div>
                </div>
            `;
            window.toggleSidebar = () => document.getElementById('inspector-sidebar').classList.toggle('sidebar-hidden');
            loadInspectorModule('inspectorDashboard');
        }

        async function loadInspectorModule(moduleName, btnElem) {
            if (btnElem) {
                document.querySelectorAll(".insp-nav-btn").forEach(b => b.classList.remove("bg-slate-800", "text-white"));
                btnElem.classList.add("bg-slate-800", "text-white");
            } else {
                const defBtn = document.getElementById(`nav-${moduleName}`);
                if(defBtn) defBtn.classList.add("bg-slate-800", "text-white");
            }

            const view = document.getElementById("inspector-viewport");
            view.innerHTML = `<div class="p-8 text-center text-xs text-slate-400 animate-pulse">Loading workspace module...</div>`;

            try {
                const fileUrl = `${moduleName}.html?v=` + new Date().getTime();
                const res = await originalFetch(fileUrl);
                const html = await res.text();
                view.innerHTML = html;

                const scripts = view.getElementsByTagName("script");
                for (let s of scripts) {
                    const sc = document.createElement("script");
                    sc.text = `(function() { try { ${s.textContent} } catch(e) { console.warn(e); } })();`;
                    document.head.appendChild(sc);
                    document.head.removeChild(sc);
                }
                if (window.lucide) lucide.createIcons();
            } catch (err) {
                view.innerHTML = `<p class="text-rose-600 text-xs font-bold p-4">Failed to load view.</p>`;
            }
        }
    </script>
</body>
</html>
